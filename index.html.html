<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal website of Dawit Demissie.">
  <title>Dawit Demissie</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #647086;
      --accent: #3157d5;
      --paper: #ffffff;
      --wash: #f2f5fb;
      --line: #dfe5f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, #dce6ff 0, transparent 35%),
        radial-gradient(circle at 85% 80%, #e7ddff 0, transparent 32%),
        var(--wash);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 24px 70px rgba(31, 45, 82, 0.14);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 9vw, 5rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .intro {
      max-width: 560px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.5vw, 1.28rem);
      line-height: 1.7;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 36px;
    }

    .detail {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
    }

    .detail strong,
    .detail span { display: block; }

    .detail strong { margin-bottom: 5px; }
    .detail span { color: var(--muted); font-size: 0.93rem; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      font-weight: 750;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(49, 87, 213, 0.25);
    }

    footer {
      margin-top: 34px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 540px) {
      .details { grid-template-columns: 1fr; }
      main { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Welcome</p>
    <h1>Dawit<br>Demissie</h1>
    <p class="intro">
      A personal corner of the web for sharing my background, interests,
      and future work.
    </p>

    <section class="details" aria-label="Highlights">
      <div class="detail">
        <strong>Yale</strong>
        <span>Attended 2015–2016</span>
      </div>
      <div class="detail">
        <strong>Mensa</strong>
        <span>Member since 2014</span>
      </div>
    </section>

    <nav class="links" aria-label="External links">
      <a href="https://github.com/dawitdemissie" target="_blank" rel="noopener noreferrer">View my GitHub</a>
    </nav>

    <footer>© <span id="year"></span> Dawit Demissie</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
